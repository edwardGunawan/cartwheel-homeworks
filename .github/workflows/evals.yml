name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run homework contract checks
        run: uv run pytest tests/test_hw_holes.py -q
      - name: Run other offline checks
        run: uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_harbor_adapter.py tests/test_replay_harness.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    needs: offline-checks
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Check model and key configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test "$CARTWHEEL_MODEL" = "gpt-4o-mini" || { echo "Set CARTWHEEL_MODEL to gpt-4o-mini for the HW6 baseline"; exit 1; }
          .venv/bin/python -c 'import os; key = os.environ.get("OPENAI_API_KEY", ""); assert key and not any(char.isspace() for char in key), "OPENAI_API_KEY is missing or malformed"'
      - name: Install Harbor
        run: uv pip install --python .venv/bin/python harbor==0.23.0
      - name: Export classified cases
        run: uv run --no-sync python scripts/export_harbor_tasks.py
      - name: Run Harbor in Docker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p .harbor
          set +e
          .venv/bin/harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes > .harbor/harbor-run.log 2>&1
          status=$?
          set -e
          echo "Harbor exited with status $status"
          exit "$status"
      - name: Summarize Harbor results
        if: always()
        run: uv run --no-sync python scripts/summarize_harbor_job.py .harbor/jobs/hw6-evals --expected-attempts 5
      - name: Redact Harbor output
        id: redact
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          .venv/bin/python scripts/redact_harbor_job.py .harbor/harbor-run.log .harbor/jobs/hw6-evals
          if test -f .harbor/harbor-run.log; then cat .harbor/harbor-run.log; fi
      - name: Upload Harbor results
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals
          path: .harbor/jobs/hw6-evals
