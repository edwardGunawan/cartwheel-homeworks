<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cartwheel · Trace review</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><a class="brand" href="/">C<span>Cartwheel <small>Trace review</small></span></a><nav aria-label="Views"><button data-view="review" aria-pressed="true">Review</button><button data-view="taxonomy">Taxonomy</button><button data-view="labels">Labeling</button><button data-view="map">Sample map</button><button data-view="progress">Progress</button></nav><span id="save-status" role="status">Loading…</span></header>
<div id="notice" role="status" hidden></div>
<div class="shell"><aside id="queue"><div class="aside-head"><h2>Conversations</h2><p id="queue-count"></p></div><label class="sr-only" for="search">Search conversations</label><input id="search" type="search" placeholder="Search messages, tools, IDs…"><div class="filters"><label>Role<select id="role"><option value="">All roles</option><option>shopper</option><option>merchant</option><option>support</option></select></label><label>Review<select id="filter"><option value="">All traces</option><option value="pending">Needs review</option><option value="reviewed">Reviewed</option></select></label></div><div id="session-list"></div><button id="refresh" class="refresh">Refresh from Langfuse</button><p id="fetched" class="aside-foot"></p></aside><main id="main"><div class="empty">Loading your trace collection…</div></main></div>
<dialog id="note-dialog"><form id="note-form"><h2>Evidence note</h2><blockquote id="note-quote"></blockquote><label>Your observation<textarea id="note-text" rows="4" required placeholder="Describe what happened and why it matters."></textarea></label><p class="muted">Open coding: describe the first failure in your own words.</p><div class="actions"><button type="button" id="cancel-note">Cancel</button><button type="submit" class="primary">Save note</button></div></form></dialog>
<dialog id="mode-dialog"><form id="mode-form"><h2>Failure mode</h2><label>Name<input name="name" required pattern="[a-z][a-z0-9_]{1,79}" placeholder="unsupported_policy_claim"></label><label>Definition<textarea name="definition" required rows="3"></textarea></label><label>Requirements<input name="requirements" placeholder="For example RESP-1; document ambiguity first"></label><label>Positive example<textarea name="example" rows="2"></textarea></label><label>Boundary / close negative<textarea name="boundary" rows="2"></textarea></label><label class="check"><input type="checkbox" name="final"> Final mode — include in structured labeling</label><div class="actions"><button type="button" id="cancel-mode">Cancel</button><button class="primary">Save mode</button></div></form></dialog>
</body></html>
